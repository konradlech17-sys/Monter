name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy silnika gry (core)
        run: ./gradlew :core:test --stacktrace

      - name: Budowanie APK (debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      # Klucz przesyłania do Google Play z sekretów repozytorium (Settings → Secrets and variables → Actions).
      # Bez sekretów paczka i tak się buduje (sprawdzamy R8), tylko jest niepodpisana.
      - name: Klucz przesyłania (Google Play)
        env:
          KEYSTORE_B64: ${{ secrets.MONTER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "MONTER_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Brak sekretu MONTER_KEYSTORE_B64 – paczka .aab będzie niepodpisana"
          fi

      - name: Paczka do Google Play (release .aab)
        env:
          MONTER_KEYSTORE_PASSWORD: ${{ secrets.MONTER_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: monter-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monter-play-aab
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports
